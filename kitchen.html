<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sawyer's Drink Co. - Kitchen Display</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <style>
    @keyframes pulse-border {
      0%, 100% { border-color: #ef4444; box-shadow: 0 0 15px rgba(239, 68, 68, 0.6); }
      50% { border-color: #f97316; box-shadow: 0 0 25px rgba(249, 115, 22, 0.8); }
    }
    .urgent-card {
      animation: pulse-border 2s infinite ease-in-out;
    }
  </style>
</head>
<body class="bg-[#1A2B4C] text-[#F5F0E1] min-h-screen font-sans">

  <!-- PASSWORD LOCK SCREEN -->
  <div id="lockScreen" class="fixed inset-0 bg-[#1A2B4C] z-50 flex items-center justify-center p-4">
    <div class="bg-[#F5F0E1] text-[#1A2B4C] rounded-2xl border-4 border-[#E0A02E] p-8 max-w-md w-full shadow-2xl text-center">
      <img src="logo.png" alt="Sawyer's Logo" class="h-20 w-20 rounded-full border-2 border-[#E0A02E] object-cover mx-auto mb-4">
      <h2 class="text-2xl font-black mb-1">Kitchen Display Access</h2>
      <p class="text-sm text-slate-600 mb-6 font-semibold">Enter Staff PIN Code to unlock</p>

      <form id="pinForm" onsubmit="unlockKitchen(event)">
        <input 
          type="password" 
          id="pinInput" 
          placeholder="Enter Passcode" 
          maxlength="10"
          required 
          class="w-full text-center text-3xl font-black tracking-widest border-4 border-[#1A2B4C] rounded-xl p-3 mb-4 focus:outline-none focus:ring-4 focus:ring-[#E0A02E]"
        />
        <p id="pinError" class="text-red-600 font-bold mb-4 hidden">Incorrect PIN Code. Try again.</p>
        
        <button 
          type="submit" 
          class="w-full bg-[#E0A02E] hover:bg-[#c88d22] text-[#1A2B4C] font-extrabold py-3 text-lg rounded-xl border-2 border-[#1A2B4C] transition"
        >
          Unlock Kitchen
        </button>
      </form>
    </div>
  </div>

  <!-- MAIN KITCHEN DISPLAY (Hidden until unlocked) -->
  <div id="kitchenApp" class="hidden">
    <header class="bg-[#0e192e] p-4 shadow-lg flex justify-between items-center border-b-4 border-[#E0A02E]">
      <div class="flex items-center gap-3">
        <img src="logo.png" alt="Sawyer's Logo" class="h-12 w-12 rounded-full border-2 border-[#E0A02E] object-cover">
        <div>
          <h1 class="text-xl font-bold tracking-wide text-[#F5F0E1]">KITCHEN DISPLAY SYSTEM</h1>
          <p class="text-xs text-[#E0A02E] uppercase font-semibold">Sawyer's Drink Co. • Preparation Station</p>
        </div>
      </div>
      <button onclick="lockScreen()" class="bg-red-600 hover:bg-red-700 text-white font-bold text-xs px-3 py-2 rounded-lg border border-red-400">
        🔒 Lock Screen
      </button>
    </header>

    <main class="p-6">
      <div id="ordersContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- Live Order Cards Load Here -->
      </div>
    </main>
  </div>

  <script>
    // Set your Kitchen Access PIN or Password here
    const KITCHEN_PIN = "1234"; 

    // Firebase Configuration
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "SENDER_ID",
      appId: "APP_ID"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // Check if unlocked previously in this session
    if (sessionStorage.getItem('kds_unlocked') === 'true') {
      showKitchen();
    }

    function unlockKitchen(e) {
      e.preventDefault();
      const input = document.getElementById('pinInput').value;
      if (input === KITCHEN_PIN) {
        sessionStorage.setItem('kds_unlocked', 'true');
        showKitchen();
      } else {
        document.getElementById('pinError').classList.remove('hidden');
        document.getElementById('pinInput').value = '';
      }
    }

    function lockScreen() {
      sessionStorage.removeItem('kds_unlocked');
      document.getElementById('lockScreen').classList.remove('hidden');
      document.getElementById('kitchenApp').classList.add('hidden');
      document.getElementById('pinInput').value = '';
    }

    function showKitchen() {
      document.getElementById('lockScreen').classList.add('hidden');
      document.getElementById('kitchenApp').classList.remove('hidden');
      initLiveOrders();
    }

    function initLiveOrders() {
      db.collection('orders')
        .where('status', '==', 'Pending')
        .orderBy('timestamp', 'asc') // Oldest orders first
        .onSnapshot((snapshot) => {
          const container = document.getElementById('ordersContainer');
          if (snapshot.empty) {
            container.innerHTML = '<div class="col-span-full text-center py-20 text-[#E0A02E] text-xl font-bold">All caught up! No active drink orders.</div>';
            return;
          }

          let html = '';
          let isFirst = true; // Tracks the oldest pending order

          snapshot.forEach((doc) => {
            const data = doc.data();

            if (isFirst) {
              // Oldest pending order (Highlighted as URGENT)
              html += `
                <div class="urgent-card bg-[#F5F0E1] text-[#1A2B4C] rounded-2xl border-4 p-5 shadow-2xl flex flex-col justify-between relative">
                  <!-- Priority Badge -->
                  <div class="absolute -top-3 right-4 bg-red-600 text-white font-extrabold text-xs px-3 py-1 rounded-full uppercase tracking-wider shadow-md">
                    ⚠️ PRIORITY / OLDEST
                  </div>

                  <div>
                    <div class="flex justify-between items-center mb-2 mt-1">
                      <span class="text-4xl font-black text-red-600">#${data.orderNumber}</span>
                      <span class="text-xs bg-[#1A2B4C] text-[#F5F0E1] px-2 py-1 rounded-md font-bold">${data.customerName}</span>
                    </div>
                    <div class="bg-[#1A2B4C] text-[#F5F0E1] p-4 rounded-xl mb-4 border-2 border-red-500">
                      <p class="text-xs font-semibold text-red-400 uppercase">Drink Item (Make Next)</p>
                      <p class="text-2xl font-black text-white">${data.size} - ${data.drink}</p>
                    </div>
                  </div>

                  <button onclick="completeOrder('${doc.id}')" class="w-full bg-red-600 hover:bg-red-700 text-white font-black py-3 rounded-xl border-2 border-[#1A2B4C] transition text-lg shadow-lg">
                    ✓ Complete Priority Order
                  </button>
                </div>
              `;
              isFirst = false; // Next orders will render normally
            } else {
              // Standard pending orders
              html += `
                <div class="bg-[#F5F0E1] text-[#1A2B4C] rounded-2xl border-4 border-[#E0A02E] p-5 shadow-2xl flex flex-col justify-between">
                  <div>
                    <div class="flex justify-between items-center mb-2">
                      <span class="text-3xl font-black text-[#1A2B4C]">#${data.orderNumber}</span>
                      <span class="text-xs bg-[#1A2B4C] text-[#F5F0E1] px-2 py-1 rounded-md font-bold">${data.customerName}</span>
                    </div>
                    <div class="bg-[#1A2B4C] text-[#F5F0E1] p-4 rounded-xl mb-4 border-2 border-[#E0A02E]">
                      <p class="text-xs font-semibold text-[#E0A02E] uppercase">Drink Item</p>
                      <p class="text-xl font-extrabold">${data.size} - ${data.drink}</p>
                    </div>
                  </div>
                  <button onclick="completeOrder('${doc.id}')" class="w-full bg-[#E0A02E] hover:bg-[#c88d22] text-[#1A2B4C] font-extrabold py-3 rounded-xl border-2 border-[#1A2B4C] transition">
                    ✓ Finish & Bump Order
                  </button>
                </div>
              `;
            }
          });
          container.innerHTML = html;
        });
    }

    async function completeOrder(id) {
      await db.collection('orders').doc(id).update({ status: 'Completed' });
    }
  </script>
</body>
</html>
