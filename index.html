<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sawyer's Drink Co. - POS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <!-- EmailJS SDK -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
</head>
<body class="bg-[#F5F0E1] text-[#1A2B4C] min-h-screen font-sans">

  <!-- Header with Brand Logo -->
  <header class="bg-[#1A2B4C] text-[#F5F0E1] p-4 shadow-lg flex justify-between items-center border-b-4 border-[#E0A02E]">
    <div class="flex items-center gap-3">
      <img src="logo.png" alt="Sawyer's Logo" class="h-12 w-12 rounded-full border-2 border-[#E0A02E] object-cover">
      <div>
        <h1 class="text-xl font-bold tracking-wide">SAWYER'S DRINK CO.</h1>
        <p class="text-xs text-[#E0A02E] uppercase font-semibold">Lemonade & Milkshakes • Register</p>
      </div>
    </div>
  </header>

  <main class="max-w-xl mx-auto p-6">
    <div class="bg-white rounded-2xl border-2 border-[#1A2B4C] shadow-xl p-6">
      <h2 class="text-xl font-bold mb-4 text-center border-b pb-2">New Customer Order</h2>
      
      <form id="posForm" class="space-y-4">
        <div>
          <label class="block text-sm font-bold mb-1">Customer Name</label>
          <input type="text" id="customerName" required placeholder="Name" class="w-full border-2 border-[#1A2B4C] rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-[#E0A02E]">
        </div>

        <div>
          <label class="block text-sm font-bold mb-1">Customer Email (Receipt)</label>
          <input type="email" id="customerEmail" required placeholder="email@example.com" class="w-full border-2 border-[#1A2B4C] rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-[#E0A02E]">
        </div>

        <!-- Drink Category: Lemonade & Slushies -->
        <div>
          <p class="text-xs font-bold text-[#E0A02E] uppercase tracking-wider mb-1">Lemonades & Slushies</p>
          <div class="grid grid-cols-2 gap-2">
            <button type="button" onclick="selectDrink('Plain Lemonade', 'lemonade_regular')" class="drink-btn p-3 border-2 border-[#1A2B4C] rounded-lg font-bold hover:bg-[#1A2B4C] hover:text-[#F5F0E1] transition">Plain Lemonade</button>
            <button type="button" onclick="selectDrink('Strawberry Lemonade', 'lemonade_strawberry')" class="drink-btn p-3 border-2 border-[#1A2B4C] rounded-lg font-bold hover:bg-[#1A2B4C] hover:text-[#F5F0E1] transition">Strawberry Lemonade</button>
            <button type="button" onclick="selectDrink('Plain Slushie', 'slushie_regular')" class="drink-btn p-3 border-2 border-[#1A2B4C] rounded-lg font-bold hover:bg-[#1A2B4C] hover:text-[#F5F0E1] transition">Plain Slushie</button>
            <button type="button" onclick="selectDrink('Strawberry Slushie', 'slushie_strawberry')" class="drink-btn p-3 border-2 border-[#1A2B4C] rounded-lg font-bold hover:bg-[#1A2B4C] hover:text-[#F5F0E1] transition">Strawberry Slushie</button>
          </div>
        </div>

        <!-- Drink Category: Milkshake -->
        <div>
          <p class="text-xs font-bold text-[#E0A02E] uppercase tracking-wider mb-1">Milkshakes</p>
          <div class="grid grid-cols-3 gap-2">
            <button type="button" onclick="selectDrink('Vanilla Milkshake', 'milkshake_vanilla')" class="drink-btn p-3 border-2 border-[#1A2B4C] rounded-lg font-bold hover:bg-[#1A2B4C] hover:text-[#F5F0E1] transition text-sm">Vanilla</button>
            <button type="button" onclick="selectDrink('Chocolate Milkshake', 'milkshake_chocolate')" class="drink-btn p-3 border-2 border-[#1A2B4C] rounded-lg font-bold hover:bg-[#1A2B4C] hover:text-[#F5F0E1] transition text-sm">Chocolate</button>
            <button type="button" onclick="selectDrink('Strawberry Milkshake', 'milkshake_strawberry')" class="drink-btn p-3 border-2 border-[#1A2B4C] rounded-lg font-bold hover:bg-[#1A2B4C] hover:text-[#F5F0E1] transition text-sm">Strawberry</button>
          </div>
        </div>

        <!-- Size Selection -->
        <div>
          <label class="block text-sm font-bold mb-1">Select Size</label>
          <div class="grid grid-cols-3 gap-2">
            <button type="button" onclick="selectSize('Small')" class="size-btn p-2 border-2 border-[#1A2B4C] rounded-lg font-bold hover:bg-[#1A2B4C] hover:text-[#F5F0E1]">Small</button>
            <button type="button" onclick="selectSize('Medium')" class="size-btn p-2 border-2 border-[#1A2B4C] rounded-lg font-bold hover:bg-[#1A2B4C] hover:text-[#F5F0E1] bg-[#1A2B4C] text-[#F5F0E1]">Medium</button>
            <button type="button" onclick="selectSize('Large')" class="size-btn p-2 border-2 border-[#1A2B4C] rounded-lg font-bold hover:bg-[#1A2B4C] hover:text-[#F5F0E1]">Large</button>
          </div>
        </div>

        <!-- Total Price Display -->
        <div class="bg-[#1A2B4C] text-[#F5F0E1] p-4 rounded-xl flex justify-between items-center font-bold text-lg">
          <span>Total Price:</span>
          <span id="priceDisplay" class="text-2xl text-[#E0A02E]">$0.00</span>
        </div>

        <button type="submit" id="submitBtn" class="w-full bg-[#E0A02E] hover:bg-[#c88d22] text-[#1A2B4C] font-extrabold py-3 rounded-xl border-2 border-[#1A2B4C] shadow-md transition">
          Submit Order & Send Email Receipt
        </button>
      </form>
    </div>
  </main>

  <script>
    // --- EMAILJS CONFIGURATION ---
    const EMAILJS_PUBLIC_KEY = "YOUR_EMAILJS_PUBLIC_KEY";
    const EMAILJS_SERVICE_ID = "YOUR_EMAILJS_SERVICE_ID";
    const EMAILJS_TEMPLATE_ID = "YOUR_EMAILJS_TEMPLATE_ID";

    emailjs.init(EMAILJS_PUBLIC_KEY);

    // --- FIREBASE CONFIGURATION ---
    const firebaseConfig = {
      apiKey: "AIzaSyBI4nMVadDvkUD3lhvwkeIEjWO2vhZQV3M",
      authDomain: "pos-app-7c542.firebaseapp.com",
      projectId: "pos-app-7c542",
      storageBucket: "pos-app-7c542.firebasestorage.app",
      messagingSenderId: "616852048734",
      appId: "1:616852048734:web:09841b675861276d429dcf"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let chosenDrink = '';
    let drinkType = '';
    let chosenSize = 'Medium';

    const PRICE_MAP = {
      lemonade_regular: { Small: 1.00, Medium: 1.75, Large: 4.00 },
      lemonade_strawberry: { Small: 1.50, Medium: 2.00, Large: 4.50 },
      slushie_regular: { Small: 1.25, Medium: 2.00, Large: 4.25 },
      slushie_strawberry: { Small: 1.75, Medium: 2.25, Large: 4.75 },
      milkshake_vanilla: { Small: 2.00, Medium: 1.75, Large: 5.00 },
      milkshake_chocolate: { Small: 2.25, Medium: 3.00, Large: 5.25 },
      milkshake_strawberry: { Small: 2.50, Medium: 3.25, Large: 5.50 }
    };

    function calculatePrice() {
      if (!drinkType || !chosenSize) return "0.00";
      return PRICE_MAP[drinkType][chosenSize].toFixed(2);
    }

    function updateTotalPrice() {
      const total = calculatePrice();
      document.getElementById('priceDisplay').innerText = `$${total}`;
    }

    function selectDrink(drink, type) {
      chosenDrink = drink;
      drinkType = type;
      document.querySelectorAll('.drink-btn').forEach(btn => btn.classList.remove('bg-[#1A2B4C]', 'text-[#F5F0E1]'));
      event.target.classList.add('bg-[#1A2B4C]', 'text-[#F5F0E1]');
      updateTotalPrice();
    }

    function selectSize(size) {
      chosenSize = size;
      document.querySelectorAll('.size-btn').forEach(btn => btn.classList.remove('bg-[#1A2B4C]', 'text-[#F5F0E1]'));
      event.target.classList.add('bg-[#1A2B4C]', 'text-[#F5F0E1]');
      updateTotalPrice();
    }

    document.getElementById('posForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!chosenDrink) { alert('Please select a drink!'); return; }

      const submitBtn = document.getElementById('submitBtn');
      submitBtn.innerText = "Sending Order...";
      submitBtn.disabled = true;

      const customerName = document.getElementById('customerName').value;
      const customerEmail = document.getElementById('customerEmail').value;
      const totalPrice = calculatePrice();

      try {
        const ordersRef = db.collection('orders');
        const snapshot = await ordersRef.get();
        let nextNum = 101;
        if (!snapshot.empty) {
          nextNum = 101 + snapshot.size;
        }

        // Save order to Firestore Database
        await ordersRef.add({
          orderNumber: nextNum,
          customerName: customerName,
          customerEmail: customerEmail,
          drink: chosenDrink,
          size: chosenSize,
          price: `$${totalPrice}`,
          status: 'Pending',
          timestamp: Date.now()
        });

        // Send Full Detailed Email Receipt via EmailJS
        if (EMAILJS_PUBLIC_KEY !== "YOUR_EMAILJS_PUBLIC_KEY") {
          await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
            to_email: customerEmail,
            customer_name: customerName,
            order_number: nextNum,
            drink_name: chosenDrink,
            drink_size: chosenSize,
            total_price: `$${totalPrice}`
          });
          alert(`Order #${nextNum} ($${totalPrice}) sent to Kitchen & Detailed Email Sent!`);
        } else {
          alert(`Order #${nextNum} ($${totalPrice}) sent to Kitchen!`);
        }

        document.getElementById('posForm').reset();
        chosenDrink = '';
        drinkType = '';
        updateTotalPrice();
        document.querySelectorAll('.drink-btn').forEach(btn => btn.classList.remove('bg-[#1A2B4C]', 'text-[#F5F0E1]'));
      } catch (err) {
        alert('Error submitting order. Check browser console.');
        console.error(err);
      } finally {
        submitBtn.innerText = "Submit Order & Send Email Receipt";
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
